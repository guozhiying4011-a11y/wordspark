<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>WordSpark · 英语表达学习</title>
<meta name="theme-color" content="#7a936a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="WordSpark" />
<link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nunito', 'Helvetica Neue', sans-serif; background: #e8ecd8; min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 430px; background: #f6f8ef; min-height: 100vh; position: relative; }
  ::-webkit-scrollbar { width: 0; }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { border-color: #7a936a !important; box-shadow: 0 0 0 3px rgba(122,147,106,0.12) !important; outline: none; }

  /* Header */
  .header { background: linear-gradient(135deg, #5e7550, #7a936a); padding: 20px 22px 18px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .header-icon { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-title { color: #fff; font-weight: 800; font-size: 17px; font-family: 'Playfair Display', Georgia, serif; }
  .header-sub { color: rgba(255,255,255,0.6); font-size: 11px; margin-top: 2px; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: #fff; border-top: 1.5px solid #e8ecd8; display: flex; padding: 8px 0; z-index: 100; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px 0; color: #9aaa92; transition: color .2s; position: relative; font-size: 11px; font-weight: 700; }
  .nav-btn.active { color: #7a936a; }
  .nav-badge { position: absolute; top: 2px; right: calc(50% - 18px); background: #e74c3c; color: #fff; border-radius: 99px; font-size: 10px; font-weight: 800; padding: 1px 5px; min-width: 16px; text-align: center; }

  /* Screens */
  .screen { padding: 0 20px 100px; display: none; }
  .screen.active { display: block; }
  .screen-title { font-size: 26px; font-weight: 800; color: #3a4a2a; font-family: 'Playfair Display', Georgia, serif; }
  .screen-sub { color: #7a8a6a; font-size: 13px; margin-top: 6px; }

  /* Form fields */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #6a7a5a; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .field input, .field textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid #dce2cc; font-size: 14px; background: #f2f5e8; color: #3a4a2a; transition: border-color .2s; }
  .field textarea { resize: vertical; min-height: 76px; }
  .field-mono input { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; }

  /* Tags */
  .tag-chip { display: inline-flex; align-items: center; gap: 4px; background: #dbe3cb; color: #4a5a3a; border-radius: 99px; padding: 3px 11px; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; border: 1.5px solid transparent; transition: all .15s; }
  .tag-chip.removable { border-color: #7a936a; cursor: pointer; }
  .tag-chip.suggested { background: #fff; color: #7a936a; border-color: #7a936a; cursor: pointer; }
  .tag-chip.suggested.selected { background: #7a936a; color: #fff; }

  /* AI suggestion box */
  .ai-box { background: linear-gradient(135deg, #f2f5e8, #e8ecd8); border: 1.5px solid #d5dcc5; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; animation: fadeIn .3s; }
  .ai-box-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; color: #6a7a5a; font-weight: 700; }
  .ai-chips { display: flex; gap: 7px; flex-wrap: wrap; }

  /* Save button */
  .save-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(135deg, #7a936a, #5e7550); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; transition: all .3s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 20px rgba(122,147,106,0.35); }
  .save-btn.saved { background: #7a936a; }

  /* Tag row */
  .tag-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; min-height: 0; }
  .custom-tag-row { display: flex; gap: 8px; }
  .custom-tag-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 2px solid #dce2cc; font-size: 13px; background: #f2f5e8; color: #3a4a2a; }
  .add-tag-btn { padding: 10px 16px; border-radius: 10px; background: #7a936a; border: none; color: #fff; cursor: pointer; font-weight: 800; font-size: 16px; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 20px; }
  .search-wrap .icon-pos { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #7a8a6a; pointer-events: none; }
  .search-input { width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px; border: 2px solid #dce2cc; font-size: 14px; background: #f2f5e8; color: #3a4a2a; }

  /* Card list */
  .card { background: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1.5px solid #e8ecd8; margin-bottom: 12px; }
  .card-expr { font-size: 17px; font-weight: 800; color: #3a4a2a; font-family: 'Playfair Display', Georgia, serif; flex: 1; }
  .card-meaning { font-size: 14px; color: #6a7a5a; margin: 6px 0 4px; font-weight: 600; }
  .card-example { font-size: 12px; color: #8a9a7a; font-style: italic; margin-bottom: 8px; }
  .card-footer { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .card-meta { margin-left: auto; font-size: 11px; color: #9aaa92; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .delete-btn { background: none; border: none; cursor: pointer; color: #c5ceb8; padding: 4px; }
  .edit-btn { background: none; border: none; cursor: pointer; color: #c5ceb8; padding: 4px; }
  .edit-btn:hover, .delete-btn:hover { color: #7a936a; }
  
  /* Edit mode */
  .card.editing .card-expr, .card.editing .card-meaning, .card.editing .card-example, .card.editing .card-footer { display: none; }
  .card.editing .card-edit-area { display: block; }
  .card-edit-area { display: none; }
  .card-edit-area .field { margin-bottom: 10px; }
  .card-edit-area .field label { font-size: 11px; }
  .card-edit-area .field input, .card-edit-area .field textarea { font-size: 13px; padding: 8px 10px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 4px; }
  .edit-actions button { flex: 1; padding: 8px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .edit-save-btn { background: linear-gradient(135deg, #7a936a, #5e7550); color: #fff; }
  .edit-cancel-btn { background: #dce2cc; color: #5e7550; }
  .edit-edit-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .edit-edit-tags .tag-chip.removable { font-size: 11px; padding: 2px 8px; }

  /* Review */
  .progress-bar { height: 5px; background: #e8ecd8; border-radius: 4px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #7a936a, #9aba8a); border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .review-header { padding-top: 32px; padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .mode-btns { display: flex; gap: 6px; }
  .mode-btn { padding: 6px 12px; border-radius: 99px; border: 2px solid #dce2cc; font-size: 11px; font-weight: 700; cursor: pointer; background: transparent; color: #7a8a6a; transition: all .2s; }
  .mode-btn.active { border-color: #7a936a; background: #7a936a; color: #fff; }

  .flip-card { background: linear-gradient(145deg, #f2f5e8, #eff2e5); border: 2px solid #d5dcc5; border-radius: 24px; padding: 36px 28px; text-align: center; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; box-shadow: 0 8px 32px rgba(122,147,106,0.10); cursor: pointer; transition: all .3s; }
  .flip-card.revealed { cursor: default; }
  .flip-card.flipping { opacity: 0; transform: scale(0.96); }
  .card-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #9aaa92; }
  .card-front { font-size: 26px; font-weight: 800; color: #3a4a2a; font-family: 'Playfair Display', Georgia, serif; line-height: 1.3; }
  .card-front.cn { font-size: 20px; font-family: inherit; }
  .card-hint { font-size: 13px; color: #9aaa92; font-style: italic; margin-top: 8px; }
  .card-back { margin-top: 16px; border-top: 1.5px solid #dce2cc; padding-top: 16px; width: 100%; animation: fadeIn .3s; }
  .card-back-answer { font-size: 18px; font-weight: 700; color: #7a936a; }
  .card-back-answer.en { font-size: 22px; font-family: 'Playfair Display', Georgia, serif; }
  .card-back-example { font-size: 13px; color: #8a9a7a; font-style: italic; margin-top: 10px; }

  .review-btns { display: flex; gap: 12px; margin-top: 20px; animation: fadeIn .3s; }
  .btn-unknown { flex: 1; padding: 14px; border-radius: 14px; border: 2px solid #e8d0c8; background: #fdf7f5; color: #c0392b; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
  .btn-known { flex: 1; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #7a936a, #5e7550); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 16px rgba(122,147,106,0.3); font-family: inherit; }

  /* Empty / Done states */
  .center-state { padding: 60px 30px; text-align: center; }
  .center-state .emoji { font-size: 64px; margin-bottom: 8px; }
  .center-state h3 { font-size: 22px; color: #3a4a2a; font-family: 'Playfair Display', Georgia, serif; margin-bottom: 8px; }
  .center-state p { color: #7a8a6a; font-size: 14px; line-height: 1.6; }
  .center-state .action-btns { display: flex; gap: 10px; margin-top: 24px; justify-content: center; flex-wrap: wrap; }
  .btn-secondary { padding: 12px 20px; border-radius: 12px; background: #e8ecd8; border: none; color: #7a936a; font-weight: 800; cursor: pointer; font-size: 14px; font-family: inherit; }
  .btn-primary { padding: 12px 20px; border-radius: 12px; background: linear-gradient(135deg, #7a936a, #5e7550); border: none; color: #fff; font-weight: 800; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(122,147,106,0.3); font-family: inherit; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; display: inline-block; }
  .empty-list { text-align: center; color: #9aaa92; padding: 40px; font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div>
      <div class="header-title">WordSpark</div>
      <div class="header-sub" id="header-sub">0 个表达 · 0 待复习</div>
    </div>
  </div>

  <!-- ADD SCREEN -->
  <div class="screen" id="screen-add">
    <div style="padding-top:32px;padding-bottom:20px">
      <div class="screen-title">记录新表达</div>
      <div class="screen-sub">Add a new English expression to your collection</div>
    </div>

    <div class="field field-mono">
      <label>英语表达 *</label>
      <input id="inp-expr" type="text" placeholder="e.g. Break the ice" />
    </div>
    <div class="field">
      <label>中文含义 *</label>
      <textarea id="inp-meaning" rows="2" placeholder="e.g. 打破沉默，缓和气氛"></textarea>
    </div>
    <div class="field">
      <label>例句（选填）</label>
      <textarea id="inp-example" placeholder="e.g. Let's play a game to break the ice."></textarea>
    </div>

    <div class="field">
      <label>分类标签</label>
      <!-- AI suggestion box -->
      <div class="ai-box" id="ai-box" style="display:none">
        <div class="ai-box-header">
          <span id="ai-box-icon" style="display:flex;align-items:center">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3zM5 17l.75 2.25L8 20l-2.25.75L5 23l-.75-2.25L2 20l2.25-.75L5 17z"/></svg>
          </span>
          <span id="ai-box-label">AI 推荐分类 · 点击选择</span>
        </div>
        <div class="ai-chips" id="ai-chips"></div>
      </div>
      <!-- selected tags -->
      <div class="tag-row" id="selected-tags"></div>
      <!-- custom tag -->
      <div class="custom-tag-row">
        <input class="custom-tag-input" id="inp-tag" type="text" placeholder="自定义标签，按 Enter 添加" />
        <button class="add-tag-btn" id="btn-add-tag">+</button>
      </div>
    </div>

    <button class="save-btn" id="btn-save">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      保存表达
    </button>
  </div>

  <!-- LIBRARY SCREEN -->
  <div class="screen" id="screen-library">
    <div style="padding-top:32px;padding-bottom:16px">
      <div class="screen-title">我的词库</div>
      <div class="screen-sub" id="lib-sub">0 expressions collected</div>
    </div>
    <div class="search-wrap">
      <span class="icon-pos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </span>
      <input class="search-input" id="search-input" type="text" placeholder="搜索表达、含义或标签…" />
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn-secondary" onclick="exportData()" style="flex:1;font-size:13px;padding:10px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        导出备份
      </button>
      <button class="btn-secondary" onclick="document.getElementById('import-file').click()" style="flex:1;font-size:13px;padding:10px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        导入恢复
      </button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
    <div id="library-list"></div>
  </div>

  <!-- REVIEW SCREEN -->
  <div class="screen" id="screen-review">
    <div class="review-header">
      <div>
        <div class="screen-title">今日复习</div>
        <div class="screen-sub" id="review-counter"></div>
      </div>
      <div class="mode-btns">
        <button class="mode-btn active" id="mode-en" onclick="setMode('meaning')">英→中</button>
        <button class="mode-btn" id="mode-cn" onclick="setMode('expression')">中→英</button>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="review-content"></div>
  </div>

  <!-- OUTPUT SCREEN -->
  <div class="screen" id="screen-output">
    <div style="padding-top:32px;padding-bottom:20px">
      <div class="screen-title">每日输出</div>
      <div class="screen-sub">Daily output challenge — 用所学表达造句</div>
    </div>
    <div id="output-content"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" id="nav-add" onclick="switchTab('add')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      添加
    </button>
    <button class="nav-btn" id="nav-library" onclick="switchTab('library')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 016.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></svg>
      词库
    </button>
    <button class="nav-btn" id="nav-review" onclick="switchTab('review')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0112 4.5v0A2.5 2.5 0 009.5 7H7a5 5 0 000 10h10a5 5 0 000-10h-2.5A2.5 2.5 0 0112 4.5v0A2.5 2.5 0 0114.5 2h0"/></svg>
      复习
      <span class="nav-badge" id="review-badge" style="display:none"></span>
    </button>
    <button class="nav-btn" id="nav-output" onclick="switchTab('output')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      输出
      <span class="nav-badge" id="output-badge" style="display:none"></span>
    </button>
  </nav>
</div>

<script>
const STORAGE_KEY = "english_expressions";
const SAMPLE = [
  { id:"s1", expression:"Break the ice", meaning:"打破沉默，缓和气氛", example:"Let's play a game to break the ice.", tags:["社交"], createdAt:new Date(Date.now()-8*86400000).toISOString(), lastReviewed:new Date(Date.now()-8*86400000).toISOString(), level:0, outputCount:0 },
  { id:"s2", expression:"Hit the nail on the head", meaning:"说得完全正确，一针见血", example:"You hit the nail on the head with that analysis.", tags:["商务"], createdAt:new Date(Date.now()-2*86400000).toISOString(), lastReviewed:new Date(Date.now()-2*86400000).toISOString(), level:1, outputCount:0 },
];

// ---- State ----
let expressions = [];
let currentTab = "add";
let reviewState = { due:[], idx:0, revealed:false, mode:"meaning", done:false };
let addState = { tags:[], suggestions:[], loadingSuggestions:false };
let debounceTimer = null;
let savedFlash = false;

function loadData() {
  try { const d = JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); return d.length ? d : SAMPLE; }
  catch { return SAMPLE; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(expressions)); }
function daysAgo(d) { return Math.floor((Date.now()-new Date(d).getTime())/86400000); }
function isDue(e) { const iv=[1,3,7,14,30]; return (e.outputCount||0) < 3 && daysAgo(e.lastReviewed??e.createdAt)>=iv[Math.min(e.level??0,4)]; }

// ---- Init ----
expressions = loadData();
(function initTab(){
  const due = expressions.filter(isDue);
  currentTab = due.length ? "review" : "add";
  renderAll();
  activateTab(currentTab);
})();

// ---- Tab switching ----
function switchTab(tab) {
  currentTab = tab;
  activateTab(tab);
  if (tab === "review") initReview();
  if (tab === "library") renderLibrary();
  if (tab === "output") initOutput();
}
function activateTab(tab) {
  ["add","library","review","output"].forEach(t => {
    document.getElementById("screen-"+t).classList.toggle("active", t===tab);
    document.getElementById("nav-"+t).classList.toggle("active", t===tab);
  });
}

// ---- Header / badge update ----
function renderAll() {
  const due = expressions.filter(isDue);
  const graduated = expressions.filter(e=>(e.outputCount||0)>=3).length;
  document.getElementById("header-sub").textContent = `${expressions.length} 个表达 · ${due.length > 0 ? due.length+" 待复习" : "全部已复习 ✓"} · ${graduated} 已毕业`;
  const badge = document.getElementById("review-badge");
  if (due.length > 0) { badge.textContent = due.length; badge.style.display = ""; }
  else { badge.style.display = "none"; }
  // 输出挑战 badge
  const ob = document.getElementById("output-badge");
  const today = new Date().toDateString();
  const didOutput = localStorage.getItem("ws-output-date") === today;
  const needOutput = expressions.some(e=>(e.outputCount||0) < 3);
  if (!didOutput && needOutput && expressions.length>0) { ob.textContent = "1"; ob.style.display = ""; }
  else { ob.style.display = "none"; }
}

// ====== ADD SCREEN ======
document.getElementById("inp-expr").addEventListener("input", onAddInput);
document.getElementById("inp-meaning").addEventListener("input", onAddInput);
document.getElementById("btn-add-tag").addEventListener("click", addCustomTag);
document.getElementById("inp-tag").addEventListener("keydown", e => { if(e.key==="Enter") addCustomTag(); });
document.getElementById("btn-save").addEventListener("click", handleSave);

function onAddInput() {
  const expr = document.getElementById("inp-expr").value.trim();
  const meaning = document.getElementById("inp-meaning").value.trim();
  clearTimeout(debounceTimer);
  if (expr.length > 2 && meaning.length > 2) {
    debounceTimer = setTimeout(() => fetchSuggestions(expr, meaning), 900);
  } else {
    hideSuggestions();
  }
}

async function fetchSuggestions(expr, meaning) {
  showSuggestionsLoading();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:200,
        messages:[{ role:"user", content:`你是一个英语学习助手。请为以下英语表达推荐2-4个简短的中文分类标签，例如：口语、商务、社交、学术、情感、日常、写作、习语、俚语、正式、非正式、职场 等。\n\n英语表达：${expr}\n中文含义：${meaning}\n\n请只返回一个JSON数组，格式如：["标签1", "标签2"]，不要有其他任何文字。` }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b=>b.type==="text")?.text || "[]";
    const clean = text.replace(/```json|```/g,"").trim();
    const tags = JSON.parse(clean);
    showSuggestions(tags.filter(t=>!addState.tags.includes(t)));
  } catch { hideSuggestions(); }
}

function showSuggestionsLoading() {
  addState.loadingSuggestions = true;
  const box = document.getElementById("ai-box");
  box.style.display = "";
  document.getElementById("ai-box-label").textContent = "AI 正在分析…";
  const icon = document.getElementById("ai-box-icon");
  icon.innerHTML = `<span class="spinning"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>`;
  document.getElementById("ai-chips").innerHTML = "";
}

function showSuggestions(tags) {
  addState.suggestions = tags;
  addState.loadingSuggestions = false;
  if (!tags.length) { hideSuggestions(); return; }
  document.getElementById("ai-box").style.display = "";
  document.getElementById("ai-box-label").textContent = "AI 推荐分类 · 点击选择";
  document.getElementById("ai-box-icon").innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3zM5 17l.75 2.25L8 20l-2.25.75L5 23l-.75-2.25L2 20l2.25-.75L5 17z"/></svg>`;
  renderAiChips();
}

function hideSuggestions() {
  document.getElementById("ai-box").style.display = "none";
  addState.suggestions = [];
}

function renderAiChips() {
  const container = document.getElementById("ai-chips");
  container.innerHTML = "";
  addState.suggestions.forEach(t => {
    const el = document.createElement("span");
    const sel = addState.tags.includes(t);
    el.className = "tag-chip suggested" + (sel ? " selected" : "");
    el.innerHTML = sel
      ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> ${t}`
      : `+ ${t}`;
    el.onclick = () => toggleSuggestionTag(t);
    container.appendChild(el);
  });
}

function toggleSuggestionTag(t) {
  if (addState.tags.includes(t)) addState.tags = addState.tags.filter(x=>x!==t);
  else addState.tags.push(t);
  renderSelectedTags();
  renderAiChips();
}

function addCustomTag() {
  const inp = document.getElementById("inp-tag");
  const val = inp.value.trim();
  if (val && !addState.tags.includes(val)) { addState.tags.push(val); renderSelectedTags(); }
  inp.value = "";
}

function removeTag(t) {
  addState.tags = addState.tags.filter(x=>x!==t);
  renderSelectedTags();
  renderAiChips();
}

function renderSelectedTags() {
  const container = document.getElementById("selected-tags");
  container.innerHTML = "";
  addState.tags.forEach(t => {
    const el = document.createElement("span");
    el.className = "tag-chip removable";
    el.innerHTML = `${t} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    el.onclick = () => removeTag(t);
    container.appendChild(el);
  });
}

function handleSave() {
  const expr = document.getElementById("inp-expr").value.trim();
  const meaning = document.getElementById("inp-meaning").value.trim();
  const example = document.getElementById("inp-example").value.trim();
  if (!expr || !meaning) return;
  // 检查重复
  const dup = expressions.find(e => e.expression.toLowerCase() === expr.toLowerCase());
  if (dup) {
    if (!confirm(`⚠️ 表达「${expr}」已存在！\n\n含义：${dup.meaning}\n\n确定仍要添加吗？`)) return;
  }
  expressions.unshift({ id:Date.now().toString(), expression:expr, meaning, example, tags:[...addState.tags], createdAt:new Date().toISOString(), lastReviewed:new Date().toISOString(), level:0, outputCount:0 });
  saveData(); renderAll();
  document.getElementById("inp-expr").value = "";
  document.getElementById("inp-meaning").value = "";
  document.getElementById("inp-example").value = "";
  addState.tags = []; addState.suggestions = [];
  renderSelectedTags(); hideSuggestions();
  const btn = document.getElementById("btn-save");
  btn.classList.add("saved");
  btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> 已保存！`;
  setTimeout(() => {
    btn.classList.remove("saved");
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> 保存表达`;
  }, 2000);
}

function editAddTag(id) {
  const inp = document.getElementById('edit-tag-input-'+id);

}

function editRemoveTag(tag) {
  editState.tags = editState.tags.filter(t=>t!==tag);
  renderEditTags(editState.id);
}

function renderEditTags(id) {
  const container = document.getElementById('edit-tags-'+id);
  if (!container) return;

    `<span class="tag-chip removable" onclick="editRemoveTag('${t.replace(/'/g,"\\'")}')">${t} <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></span>`
  ).join("");
}

function saveEdit(id) {
  const expr = document.getElementById('edit-expr-'+id).value.trim();
  const meaning = document.getElementById('edit-meaning-'+id).value.trim();
  if (!expr || !meaning) return;
  expressions = expressions.map(e => e.id===id ? {...e, expression:expr, meaning, example:document.getElementById('edit-example-'+id).value.trim(), tags:[...editState.tags]} : e);
  saveData(); renderAll(); renderLibrary();
}

function cancelEdit(id) {
  editState = { id:null, tags:[] };
  renderLibrary();
}

// ====== 数据导入导出 ======
function exportData() {
  const blob = new Blob([JSON.stringify(expressions, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wordspark-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      const merged = [...data, ...expressions];
      // 按 id 去重
      const seen = new Set();
      expressions = merged.filter(item => {
        if (seen.has(item.id)) return false;
        seen.add(item.id);
        return true;
      });
      saveData(); renderAll(); renderLibrary();
      alert(`导入成功！共 ${data.length} 条记录，合并后共 ${expressions.length} 条。`);
    } catch(err) {
      alert('导入失败：文件格式不正确，请选择 WordSpark 备份文件 (.json)');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ====== REVIEW SCREEN ======
function setMode(m) {
  reviewState.mode = m;
  reviewState.revealed = false;
  document.getElementById("mode-en").classList.toggle("active", m==="meaning");
  document.getElementById("mode-cn").classList.toggle("active", m==="expression");
  renderReview();
}

function initReview() {
  reviewState = { due: expressions.filter(isDue), idx:0, revealed:false, mode: reviewState.mode||"meaning", done:false };
  renderReview();
}

function renderReview() {
  const { due, idx, revealed, mode, done } = reviewState;
  const content = document.getElementById("review-content");
  const progressFill = document.getElementById("progress-fill");
  const counter = document.getElementById("review-counter");

  if (!due.length) {
    progressFill.style.width = "100%";
    counter.textContent = "";
    content.innerHTML = `
      <div class="center-state">
        <div class="emoji">🌿</div>
        <h3>今天没有待复习的内容</h3>
        <p>继续添加新表达，或等待明天的复习计划</p>
        <div class="action-btns">
          <button class="btn-primary" onclick="switchTab('add')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            添加新表达
          </button>
        </div>
      </div>`;
    return;
  }

  if (done) {
    progressFill.style.width = "100%";
    counter.textContent = "";
    content.innerHTML = `
      <div class="center-state">
        <div class="emoji">✨</div>
        <h3>复习完成！</h3>
        <p>今天复习了 <strong>${due.length}</strong> 个表达，太棒了！</p>
        <div class="action-btns">
          <button class="btn-secondary" onclick="restartReview()">再来一轮</button>
          <button class="btn-primary" onclick="switchTab('add')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            添加新词
          </button>
        </div>
      </div>`;
    return;
  }

  const cur = due[idx];
  const pct = (idx / due.length) * 100;
  progressFill.style.width = pct + "%";
  counter.textContent = `${idx+1} / ${due.length}`;

  const frontText = mode==="meaning" ? cur.expression : cur.meaning;
  const frontClass = mode==="meaning" ? "card-front" : "card-front cn";
  const backText = mode==="meaning" ? cur.meaning : cur.expression;
  const backClass = mode==="expression" ? "card-back-answer en" : "card-back-answer";
  const frontLabel = mode==="meaning" ? "英语表达" : "中文含义";
  const backLabel = mode==="meaning" ? "中文含义" : "英语表达";
  const tagHtml = (cur.tags||[]).map(t=>`<span class="tag-chip">${t}</span>`).join("");

  content.innerHTML = `
    <div class="flip-card ${revealed?"revealed":""}" id="flip-card" ${!revealed?'onclick="revealCard()"':""}>
      <div class="card-label">${frontLabel}</div>
      <div class="${frontClass}">${frontText}</div>
      ${tagHtml ? `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${tagHtml}</div>` : ""}
      ${!revealed ? `<div class="card-hint">点击翻转查看答案</div>` : ""}
      ${revealed ? `
        <div class="card-back">
          <div class="card-label" style="margin-bottom:8px">${backLabel}</div>
          <div class="${backClass}">${backText}</div>
          ${cur.example ? `<div class="card-back-example">"${cur.example}"</div>` : ""}
        </div>` : ""}
    </div>
    ${revealed ? `
      <div class="review-btns">
        <button class="btn-unknown" onclick="nextCard(false)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          不熟悉
        </button>
        <button class="btn-known" onclick="nextCard(true)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          已掌握
        </button>
      </div>` : ""}
  `;
}

function revealCard() {
  reviewState.revealed = true;
  renderReview();
}

function nextCard(knew) {
  const { due, idx } = reviewState;
  const cur = due[idx];
  // update expression
  expressions = expressions.map(e => e.id!==cur.id ? e : {
    ...e, lastReviewed:new Date().toISOString(),
    level: knew ? Math.min((e.level??0)+1,4) : 0
  });
  saveData(); renderAll();

  // flip animation
  const card = document.getElementById("flip-card");
  if (card) { card.classList.add("flipping"); }
  setTimeout(() => {
    reviewState.revealed = false;
    if (idx+1 >= due.length) reviewState.done = true;
    else reviewState.idx = idx+1;
    renderReview();
  }, 300);
}

function restartReview() {
  reviewState = { due: expressions.filter(isDue), idx:0, revealed:false, mode:reviewState.mode, done:false };
  renderReview();
}

// ====== OUTPUT SCREEN ======
let outputState = { expr:null, submitted:false };

function initOutput() {
  const today = new Date().toDateString();
  const didOutput = localStorage.getItem("ws-output-date") === today;
  const allGraduated = expressions.filter(e=>(e.outputCount||0) < 3).length === 0;
  
  if (allGraduated) {
    outputState = { expr:null, submitted:true };
    renderOutput();
    return;
  }
  
  if (didOutput) {
    // 检查是否有已保存的状态
    const saved = JSON.parse(localStorage.getItem("ws-output-state")||"null");
    if (saved && saved.date === today) {
      outputState = { expr:saved.expr, submitted:true };
    } else {
      // 今天已完成但没有保存状态，随机一个展示
      const pool = expressions.filter(e=>(e.outputCount||0) < 3);
      outputState = { expr:pool[Math.floor(Math.random()*pool.length)], submitted:true };
    }
    renderOutput();
    return;
  }
  
  // 随机选一个未毕业的表达
  const pool = expressions.filter(e=>(e.outputCount||0) < 3);
  if (pool.length === 0) { outputState = { expr:null, submitted:true }; renderOutput(); return; }
  // 优先选 outputCount 少的
  pool.sort((a,b) => (a.outputCount||0) - (b.outputCount||0));
  const minCount = pool[0].outputCount||0;
  const candidates = pool.filter(e=>(e.outputCount||0) === minCount);
  const expr = candidates[Math.floor(Math.random()*candidates.length)];
  outputState = { expr, submitted:false };
  renderOutput();
}

function renderOutput() {
  const content = document.getElementById("output-content");
  const { expr, submitted } = outputState;
  
  if (submitted) {
    content.innerHTML = `
      <div class="center-state">
        <div class="emoji">${(expr&&(expr.outputCount||0)>=3) ? '🎉' : '✅'}</div>
        <h3>${(expr&&(expr.outputCount||0)>=3) ? '毕业快乐！' : '今天已完成输出挑战'}</h3>
        <p>${(expr&&(expr.outputCount||0)>=3) ? `「${expr.expression}」已成功毕业！` : (expr ? `今日表达「${expr.expression}」已输出，明天继续！` : '所有表达都已毕业！')}</p>
        ${expr && (expr.outputCount||0) < 3 ? `<p style="color:#9aaa92;font-size:13px;margin-top:4px">输出进度：${expr.outputCount}/3 次</p>` : ''}
        <div class="action-btns">
          ${expr && (expr.outputCount||0) < 3 ? `<button class="btn-secondary" onclick="retryOutput()">再练一次</button>` : ''}
          <button class="btn-primary" onclick="switchTab('add')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            添加新表达
          </button>
        </div>
      </div>`;
    return;
  }
  
  if (!expr) {
    content.innerHTML = `<div class="center-state"><div class="emoji">🌿</div><h3>暂无待输出的表达</h3><p>先添加一些表达再来吧！</p></div>`;
    return;
  }
  
  content.innerHTML = `
    <div class="flip-card">
      <div class="card-label">今日输出挑战</div>
      <div class="card-front" style="font-size:22px">${expr.expression}</div>
      <div style="margin-top:8px;color:#9aaa92;font-size:13px">${expr.meaning}</div>
      <div style="margin-top:4px">${(expr.tags||[]).map(t=>`<span class="tag-chip">${t}</span>`).join("")}</div>
      ${expr.example ? `<div class="card-hint">例句参考：${expr.example}</div>` : ''}
    </div>
    <div style="margin-top:20px">
      <div class="field">
        <label>用这个表达造一个句子</label>
        <textarea id="output-sentence" rows="3" placeholder="用 ${expr.expression} 造一个句子..."></textarea>
      </div>
      <button class="save-btn" onclick="submitOutput()" style="margin-top:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
        提交输出
      </button>
    </div>
  `;
}

function submitOutput() {
  const sentence = document.getElementById("output-sentence").value.trim();
  if (!sentence) return;
  
  const expr = outputState.expr;
  if (!expr) return;
  
  // 检查是否包含关键词
  const containsKeyword = sentence.toLowerCase().includes(expr.expression.toLowerCase());
  
  expressions = expressions.map(e => e.id!==expr.id ? e : {
    ...e, outputCount: Math.min((e.outputCount||0)+1, 3)
  });
  saveData();
  
  const today = new Date().toDateString();
  localStorage.setItem("ws-output-date", today);
  localStorage.setItem("ws-output-state", JSON.stringify({date:today, expr:{...expr, outputCount:(expr.outputCount||0)+1}}));
  
  const newCount = (expr.outputCount||0)+1;
  outputState.submitted = true;
  outputState.expr = expressions.find(e=>e.id===expr.id);
  renderAll();
  renderOutput();
  
  // 延迟显示反馈
  setTimeout(() => {
    const feedback = containsKeyword ? 
      (newCount >= 3 ? '🎉 毕业！' : `✅ 已记录！(${newCount}/3)`) :
      `⚠️ 已记录，但你的句子中没有包含「${expr.expression}」这个词，请注意使用该表达。`;
    alert(feedback);
  }, 300);
}

function retryOutput() {
  const today = new Date().toDateString();
  localStorage.removeItem("ws-output-date");
  localStorage.removeItem("ws-output-state");
  initOutput();
}

// Initial renders
renderAll();
if (currentTab === "library") renderLibrary();
if (currentTab === "review") initReview();
if (currentTab === "output") initOutput();
</script>
</body>
</html>
